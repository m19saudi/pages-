<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
<title>Pages الصفحات</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    background:#f3f1ec;
    color:#18221f;
}

/* =========================
   HEADER
========================= */

header{
    background:#132723;
    color:#fff;
    padding:32px 20px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.header-inner{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    min-height:72px;
}

.brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.brand h1{
    margin:0;
    font-size:25px;
    font-weight:600;
    letter-spacing:.1px;
}

.brand p{
    margin:4px 0 0;
    font-size:13px;
    color:#d8ddd9;
    font-weight:500;
}

.header-actions{
    position:absolute;
    left:0;
    display:flex;
    align-items:center;
    gap:9px;
}

.header-btn{
    border:0;
    border-radius:10px;
    padding:10px 14px;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:
        transform .18s ease,
        opacity .18s ease,
        box-shadow .18s ease;
    white-space:nowrap;
}

.header-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.header-btn:active{
    transform:translateY(0);
}

.header-btn.add{
    background:#bda16a;
    color:#17221f;
}

.header-btn.edit{
    background:#fff;
    color:#173029;
}

.header-btn.finish{
    background:#527c69;
    color:#fff;
    display:none;
}

/* =========================
   MAIN
========================= */

main{
    max-width:1100px;
    margin:45px auto;
    padding:0 20px;
}

.sites{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px;
}

/* =========================
   SITE CARD
========================= */

.site-card{
    position:relative;
    min-height:85px;
    background:#fff;
    border:1px solid #e2dfd8;
    border-radius:14px;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow:0 3px 12px rgba(30,35,32,.045);
    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
    overflow:hidden;
}

.site-card:hover{
    background:#bda16a;
    border-color:#bda16a;
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.site-card a{
    color:#17231f;
    text-decoration:none;
    font-size:18px;
    font-weight:600;
    line-height:1.45;
    word-break:break-word;
    width:100%;
}

.site-card:hover a{
    color:#fff;
}

/* =========================
   EDIT MODE
========================= */

.site-card.editing{
    cursor:grab;
    border:2px dashed #bda16a;
    background:#fffdf8;
}

.site-card.editing:active{
    cursor:grabbing;
}

.site-card.dragging{
    opacity:.4;
    transform:scale(.97);
}

.site-card .edit-actions{
    position:absolute;
    top:8px;
    left:8px;
    display:flex;
    gap:6px;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
}

.site-card.editing .edit-actions{
    opacity:1;
    pointer-events:auto;
}

.card-edit,
.card-delete{
    width:30px;
    height:30px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    transition:transform .15s ease;
}

.card-edit{
    background:#eeeae2;
    color:#26312d;
}

.card-delete{
    background:#f8dddd;
    color:#c62828;
    font-size:17px;
}

.card-edit:hover,
.card-delete:hover{
    transform:scale(1.06);
}

/* =========================
   EMPTY / LOADING
========================= */

.empty,
.loading{
    grid-column:1 / -1;
    background:#fff;
    border:1px solid #e2dfd8;
    border-radius:16px;
    min-height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#77736c;
    font-size:15px;
}

.loading{
    color:#6f756f;
}

/* =========================
   MODALS
========================= */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(10,18,15,.55);
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:min(100%,460px);
    background:#fff;
    border-radius:18px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
    overflow:hidden;
    animation:modalIn .18s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(10px) scale(.98);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.modal-header{
    padding:20px 22px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.modal-header h2{
    margin:0;
    font-size:20px;
    color:#17231f;
}

.close-modal{
    width:34px;
    height:34px;
    border:0;
    border-radius:9px;
    background:#f0eee9;
    color:#555;
    cursor:pointer;
    font-size:20px;
    line-height:1;
}

.modal-body{
    padding:4px 22px 22px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:700;
    color:#404944;
}

.form-group input{
    width:100%;
    height:46px;
    border:1px solid #d9d6ce;
    border-radius:10px;
    padding:0 13px;
    font-family:inherit;
    font-size:14px;
    outline:none;
    direction:rtl;
    transition:border-color .18s ease,box-shadow .18s ease;
}

.form-group input:focus{
    border-color:#bda16a;
    box-shadow:0 0 0 3px rgba(189,161,106,.14);
}

.modal-footer{
    padding:0 22px 22px;
    display:flex;
    justify-content:flex-start;
    gap:9px;
}

.modal-btn{
    border:0;
    border-radius:10px;
    padding:11px 18px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
}

.modal-btn.primary{
    background:#132723;
    color:#fff;
}

.modal-btn.secondary{
    background:#eeeae3;
    color:#303833;
}

.modal-btn.danger{
    background:#c62828;
    color:#fff;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translate(-50%,20px);
    background:#132723;
    color:#fff;
    padding:12px 18px;
    border-radius:11px;
    font-size:13px;
    font-weight:700;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    opacity:0;
    pointer-events:none;
    transition:
        opacity .2s ease,
        transform .2s ease;
    z-index:2000;
    max-width:calc(100% - 30px);
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.toast.error{
    background:#b3261e;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        padding:25px 14px;
    }

    .header-inner{
        min-height:auto;
        flex-direction:column;
        gap:14px;
    }

    .brand{
        order:1;
    }

    .brand h1{
        font-size:21px;
    }

    .header-actions{
        position:static;
        width:100%;
        justify-content:center;
        flex-wrap:wrap;
        order:2;
    }

    .header-btn{
        font-size:12px;
        padding:9px 11px;
    }

    main{
    margin:30px auto;
    padding:0 15px;
    }

    .sites{
    grid-template-columns:1fr;
    gap:12px;
}

    .site-card{
        min-height:70px;
        padding:20px;
    }

    .site-card a{
        font-size:17px;
    }

    .modal{
        border-radius:15px;
    }
}

@media(max-width:420px){

    .sites{
        grid-template-columns:1fr 1fr;
    }

    .header-btn{
        flex:1;
        min-width:120px;
    }
}
</style>
</head>

<body>

<header id="header">
    <div class="header-inner">

        <div class="brand">
            <h1>المواقع Sites</h1>
            <p>بوابة المواقع</p>
        </div>

        <div class="header-actions">
            <button class="header-btn add" id="addBtn">
                ＋ إضافة موقع
            </button>

            <button class="header-btn edit" id="editBtn">
                ✏️ تعديل المواقع
            </button>

            <button class="header-btn finish" id="finishBtn">
                ✓ إنهاء التعديل
            </button>
        </div>

    </div>
</header>

<main>
    <div class="sites" id="sites">
        <div class="loading">جاري تحميل المواقع…</div>
    </div>
</main>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="siteModal">
    <div class="modal">

        <div class="modal-header">
            <h2 id="modalTitle">إضافة موقع</h2>
            <button class="close-modal" id="closeSiteModal">×</button>
        </div>

        <div class="modal-body">

            <div class="form-group">
                <label for="siteName">اسم الموقع</label>
                <input
                    id="siteName"
                    type="text"
                    placeholder="مثال: نظام المختبر"
                    autocomplete="off"
                >
            </div>

            <div class="form-group">
                <label for="siteUrl">رابط الموقع</label>
                <input
                    id="siteUrl"
                    type="url"
                    placeholder="https://example.com"
                    autocomplete="off"
                    dir="ltr"
                >
            </div>

        </div>

        <div class="modal-footer">
            <button class="modal-btn primary" id="saveSiteBtn">
                حفظ
            </button>

            <button class="modal-btn secondary" id="cancelSiteBtn">
                إلغاء
            </button>
        </div>

    </div>
</div>

<!-- Delete Confirmation -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal">

        <div class="modal-header">
            <h2>حذف الموقع</h2>
            <button class="close-modal" id="closeDeleteModal">×</button>
        </div>

        <div class="modal-body">
            <p id="deleteMessage" style="
                margin:0;
                color:#555;
                line-height:1.8;
                font-size:14px;
            ">
                هل أنت متأكد من حذف هذا الموقع؟
            </p>
        </div>

        <div class="modal-footer">

            <button class="modal-btn danger" id="confirmDeleteBtn">
                حذف
            </button>

            <button class="modal-btn secondary" id="cancelDeleteBtn">
                إلغاء
            </button>

        </div>

    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

/* =========================================================
   FIREBASE
   IMPORTANT:
   This restores the original working architecture:
   /api/config -> Firebase client SDK -> Realtime Database
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    set
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================================================
   ELEMENTS
========================================================= */

const sitesEl = document.getElementById("sites");

const addBtn = document.getElementById("addBtn");
const editBtn = document.getElementById("editBtn");
const finishBtn = document.getElementById("finishBtn");

const siteModal = document.getElementById("siteModal");
const deleteModal = document.getElementById("deleteModal");

const modalTitle = document.getElementById("modalTitle");

const siteName = document.getElementById("siteName");
const siteUrl = document.getElementById("siteUrl");

const saveSiteBtn = document.getElementById("saveSiteBtn");
const cancelSiteBtn = document.getElementById("cancelSiteBtn");
const closeSiteModal = document.getElementById("closeSiteModal");

const closeDeleteModal = document.getElementById("closeDeleteModal");
const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

const deleteMessage = document.getElementById("deleteMessage");

const toastEl = document.getElementById("toast");


/* =========================================================
   STATE
========================================================= */

let db = null;

let sitesData = [];

let editMode = false;

let editingIndex = null;

let deletingIndex = null;

let draggedCard = null;


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function toast(message, error = false){

    clearTimeout(toastTimer);

    toastEl.textContent = message;

    toastEl.classList.toggle("error", error);

    toastEl.classList.add("show");

    toastTimer = setTimeout(() => {
        toastEl.classList.remove("show");
    }, 2800);
}


/* =========================================================
   MODALS
========================================================= */

function showModal(element){

    element.classList.add("show");
}

function hideModal(element){

    element.classList.remove("show");
}


/* =========================================================
   LOAD FIREBASE CONFIG
========================================================= */

async function boot(){

    try{

        /*
         * This is the important fix.
         *
         * Your working project already provides:
         *
         * /api/config
         *
         * We are NOT calling /api/sites anymore.
         */

        const response = await fetch(
            "/api/config",
            {
                cache:"no-store"
            }
        );

        if(!response.ok){

            throw new Error(
                "تعذر تحميل إعدادات Firebase."
            );
        }

        const config = await response.json();

        if(
            !config.apiKey ||
            !config.projectId ||
            !config.databaseURL
        ){

            throw new Error(
                "إعدادات Firebase غير مكتملة."
            );
        }

        const app = initializeApp(config);

        db = getDatabase(
            app,
            config.databaseURL
        );

        listenToSites();

    }catch(error){

        console.error(error);

        sitesEl.innerHTML = `
            <div class="empty">
                تعذر الاتصال بقاعدة البيانات.
            </div>
        `;

        toast(
            error.message ||
            "حدث خطأ أثناء تشغيل الموقع.",
            true
        );
    }
}


/* =========================================================
   FIREBASE LISTENER
========================================================= */

function listenToSites(){

    if(!db){

        toast(
            "Firebase غير متصل.",
            true
        );

        return;
    }

    const sitesRef = ref(
        db,
        "sites"
    );

    onValue(
        sitesRef,

        snapshot => {

            const value = snapshot.val();

            /*
             * Your original database structure is an array.
             */

            sitesData =
                Array.isArray(value)
                    ? value.filter(Boolean)
                    : [];

            render();
        },

        error => {

            console.error(error);

            sitesEl.innerHTML = `
                <div class="empty">
                    تعذر تحميل المواقع.
                </div>
            `;

            toast(
                "تحقق من Firebase وقواعد Realtime Database.",
                true
            );
        }
    );
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    if(!sitesData.length){

        sitesEl.innerHTML = `
            <div class="empty">
                لا توجد مواقع مضافة حالياً.
            </div>
        `;

        return;
    }

    sitesEl.innerHTML = "";

    sitesData.forEach(
        (site,index) => {

            const card =
                document.createElement("div");

            card.className =
                "site-card" +
                (editMode ? " editing" : "");

            /*
             * Keep the actual object attached to the card.
             * This makes drag/reordering reliable.
             */

            card._site = site;

            card.draggable = editMode;

            const link =
                document.createElement("a");

            link.href =
                normalizeUrl(site.url);

            link.target =
                "_blank";

            link.rel =
                "noopener noreferrer";

            link.textContent =
                site.name || "موقع بدون اسم";

            card.appendChild(link);


            /* -------------------------
               EDIT CONTROLS
            ------------------------- */

            if(editMode){

                const actions =
                    document.createElement("div");

                actions.className =
                    "edit-actions";

                const edit =
                    document.createElement("button");

                edit.className =
                    "card-edit";

                edit.type =
                    "button";

                edit.title =
                    "تعديل";

                edit.textContent =
                    "✏️";

                edit.addEventListener(
                    "click",
                    event => {

                        event.preventDefault();
                        event.stopPropagation();

                        openEditModal(index);
                    }
                );


                const del =
                    document.createElement("button");

                del.className =
                    "card-delete";

                del.type =
                    "button";

                del.title =
                    "حذف";

                /*
                 * Red X instead of trash icon.
                 */

                del.textContent =
                    "×";

                del.addEventListener(
                    "click",
                    event => {

                        event.preventDefault();
                        event.stopPropagation();

                        openDeleteModal(index);
                    }
                );


                actions.appendChild(edit);

                actions.appendChild(del);

                card.appendChild(actions);


                /* -------------------------
                   DRAG EVENTS
                ------------------------- */

                card.addEventListener(
                    "dragstart",
                    () => {

                        draggedCard = card;

                        card.classList.add(
                            "dragging"
                        );
                    }
                );

                card.addEventListener(
                    "dragend",
                    () => {

                        card.classList.remove(
                            "dragging"
                        );

                        draggedCard = null;

                        saveOrderFromDOM();
                    }
                );

                card.addEventListener(
                    "dragover",
                    event => {

                        event.preventDefault();

                        if(
                            !draggedCard ||
                            draggedCard === card
                        ){

                            return;
                        }

                        const rect =
                            card.getBoundingClientRect();

                        const middle =
                            rect.top +
                            rect.height / 2;

                        if(
                            event.clientY < middle
                        ){

                            sitesEl.insertBefore(
                                draggedCard,
                                card
                            );

                        }else{

                            sitesEl.insertBefore(
                                draggedCard,
                                card.nextSibling
                            );
                        }
                    }
                );
            }


            /* -------------------------
               NORMAL CLICK
            ------------------------- */

            if(!editMode){

                card.addEventListener(
                    "click",
                    event => {

                        if(
                            event.target.closest("a")
                        ){

                            return;
                        }

                        window.open(
                            normalizeUrl(site.url),
                            "_blank",
                            "noopener,noreferrer"
                        );
                    }
                );
            }


            sitesEl.appendChild(card);
        }
    );
}


/* =========================================================
   URL NORMALIZATION
========================================================= */

function normalizeUrl(url){

    if(!url){

        return "#";
    }

    const trimmed =
        String(url).trim();

    if(
        trimmed.startsWith("http://") ||
        trimmed.startsWith("https://")
    ){

        return trimmed;
    }

    return "https://" + trimmed;
}


/* =========================================================
   SAVE TO FIREBASE
========================================================= */

async function saveSites(
    showMessage = true
){

    if(!db){

        toast(
            "Firebase غير متصل.",
            true
        );

        return false;
    }

    try{

        await set(
            ref(
                db,
                "sites"
            ),
            sitesData.length
                ? sitesData
                : null
        );

        if(showMessage){

            toast(
                "تم حفظ التغييرات."
            );
        }

        return true;

    }catch(error){

        console.error(error);

        toast(
            "تعذر الحفظ: " +
            (
                error.message ||
                "تحقق من Firebase."
            ),
            true
        );

        return false;
    }
}


/* =========================================================
   SAVE DRAG ORDER
========================================================= */

async function saveOrderFromDOM(){

    if(!editMode){

        return;
    }

    const cards =
        Array.from(
            sitesEl.querySelectorAll(
                ".site-card"
            )
        );

    const reordered =
        cards
            .map(card => card._site)
            .filter(Boolean);

    if(
        reordered.length !==
        sitesData.length
    ){

        return;
    }

    sitesData =
        reordered;

    await saveSites(false);

    toast(
        "تم تحديث ترتيب المواقع."
    );
}


/* =========================================================
   EDIT MODE
========================================================= */

function enterEditMode(){

    editMode = true;

    editBtn.style.display =
        "none";

    finishBtn.style.display =
        "inline-block";

    render();

    toast(
        "يمكنك الآن تعديل وترتيب المواقع."
    );
}


function finishEditMode(){

    editMode = false;

    editBtn.style.display =
        "inline-block";

    finishBtn.style.display =
        "none";

    render();

    toast(
        "تم إنهاء التعديل."
    );
}


/* =========================================================
   ADD MODAL
========================================================= */

function openAddModal(){

    editingIndex = null;

    modalTitle.textContent =
        "إضافة موقع";

    siteName.value = "";

    siteUrl.value = "";

    showModal(
        siteModal
    );

    setTimeout(
        () => siteName.focus(),
        100
    );
}


/* =========================================================
   EDIT MODAL
========================================================= */

function openEditModal(index){

    if(
        !sitesData[index]
    ){

        return;
    }

    editingIndex =
        index;

    modalTitle.textContent =
        "تعديل الموقع";

    siteName.value =
        sitesData[index].name ||
        "";

    siteUrl.value =
        sitesData[index].url ||
        "";

    showModal(
        siteModal
    );

    setTimeout(
        () => siteName.focus(),
        100
    );
}


/* =========================================================
   SAVE SITE
========================================================= */

async function saveSite(){

    const name =
        siteName.value.trim();

    const url =
        siteUrl.value.trim();

    if(!name){

        toast(
            "يرجى إدخال اسم الموقع.",
            true
        );

        siteName.focus();

        return;
    }

    if(!url){

        toast(
            "يرجى إدخال رابط الموقع.",
            true
        );

        siteUrl.focus();

        return;
    }


    const site = {
        name,
        url
    };


    /* ADD */

    if(editingIndex === null){

        sitesData.push(
            site
        );

        const success =
            await saveSites(false);

        if(success){

            hideModal(
                siteModal
            );

            toast(
                "تمت إضافة الموقع."
            );

            render();
        }

        return;
    }


    /* EDIT */

    sitesData[
        editingIndex
    ] = site;

    const success =
        await saveSites(false);

    if(success){

        hideModal(
            siteModal
        );

        toast(
            "تم تعديل الموقع."
        );

        render();
    }
}


/* =========================================================
   DELETE MODAL
========================================================= */

function openDeleteModal(index){

    if(
        !sitesData[index]
    ){

        return;
    }

    deletingIndex =
        index;

    deleteMessage.textContent =
        `هل أنت متأكد من حذف "${sitesData[index].name}"؟`;

    showModal(
        deleteModal
    );
}


/* =========================================================
   DELETE SITE
========================================================= */

async function deleteSite(){

    if(
        deletingIndex === null ||
        !sitesData[deletingIndex]
    ){

        return;
    }

    sitesData.splice(
        deletingIndex,
        1
    );

    const success =
        await saveSites(false);

    if(success){

        hideModal(
            deleteModal
        );

        deletingIndex =
            null;

        toast(
            "تم حذف الموقع."
        );

        render();
    }
}


/* =========================================================
   EVENTS
========================================================= */

addBtn.addEventListener(
    "click",
    openAddModal
);

editBtn.addEventListener(
    "click",
    enterEditMode
);

finishBtn.addEventListener(
    "click",
    finishEditMode
);

saveSiteBtn.addEventListener(
    "click",
    saveSite
);

cancelSiteBtn.addEventListener(
    "click",
    () => hideModal(siteModal)
);

closeSiteModal.addEventListener(
    "click",
    () => hideModal(siteModal)
);

closeDeleteModal.addEventListener(
    "click",
    () => hideModal(deleteModal)
);

cancelDeleteBtn.addEventListener(
    "click",
    () => {

        deletingIndex =
            null;

        hideModal(deleteModal);
    }
);

confirmDeleteBtn.addEventListener(
    "click",
    deleteSite
);


/* =========================================================
   CLICK OUTSIDE MODAL
========================================================= */

siteModal.addEventListener(
    "click",
    event => {

        if(
            event.target === siteModal
        ){

            hideModal(
                siteModal
            );
        }
    }
);

deleteModal.addEventListener(
    "click",
    event => {

        if(
            event.target === deleteModal
        ){

            deletingIndex =
                null;

            hideModal(
                deleteModal
            );
        }
    }
);


/* =========================================================
   ENTER KEY IN FORM
========================================================= */

siteName.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            siteUrl.focus();
        }
    }
);

siteUrl.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            saveSite();
        }
    }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key !== "Escape"
        ){

            return;
        }

        hideModal(
            siteModal
        );

        hideModal(
            deleteModal
        );
    }
);


/* =========================================================
   START
========================================================= */

boot();

</script>

</body>
</html>
