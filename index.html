<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#132723">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📄%3C/text%3E%3C/svg%3E">

<title>Sites المواقع</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --green:#132723;
  --green2:#1d3a34;
  --gold:#bda16a;
  --bg:#f4f2ed;
  --text:#24332f;
  --muted:#74817d;
  --card:#ffffff;
  --border:#e3dfd6;
  --danger:#c94a4a;
  --shadow:0 10px 30px rgba(19,39,35,.08);
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Tahoma,sans-serif;
  background:
    radial-gradient(circle at top right,rgba(189,161,106,.08),transparent 30%),
    var(--bg);
  color:var(--text);
}

button,
input{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

header{
  background:
    linear-gradient(135deg,#10231f 0%,#18332d 55%,#1d3a34 100%);
  color:#fff;
  padding:38px 20px 32px;
  text-align:center;
  box-shadow:0 6px 30px rgba(0,0,0,.12);
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

.logo{
  width:52px;
  height:52px;
  margin:0 auto 13px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.14);
  font-size:27px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}

header h1{
  margin:0;
  font-size:29px;
  font-weight:800;
  letter-spacing:.1px;
}

header p{
  margin:8px 0 0;
  color:#d5e0dc;
  font-size:14px;
}

main{
  width:min(1100px,100%);
  margin:36px auto;
  padding:0 20px 70px;
}

/* TOOLBAR */

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:22px;
}

.status{
  color:var(--muted);
  font-size:14px;
}

.toolbar-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.primary,
.edit-toggle,
.finish-edit,
.secondary{
  border-radius:12px;
  padding:11px 17px;
  cursor:pointer;
  transition:.2s ease;
  font-weight:700;
}

.primary{
  border:0;
  background:var(--green);
  color:#fff;
  box-shadow:0 6px 17px rgba(19,39,35,.15);
}

.primary:hover{
  background:var(--green2);
  transform:translateY(-1px);
}

.edit-toggle{
  border:1px solid var(--green);
  background:#fff;
  color:var(--green);
}

.edit-toggle:hover{
  background:#f2f6f4;
  transform:translateY(-1px);
}

.finish-edit{
  border:0;
  background:var(--gold);
  color:#fff;
  box-shadow:0 6px 17px rgba(189,161,106,.20);
}

.finish-edit:hover{
  transform:translateY(-1px);
  filter:brightness(.97);
}

.secondary{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
}

.secondary:hover{
  background:#f8f7f4;
}

/* SITE CARDS */

.sites{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:18px;
}

.site-card{
  position:relative;
  min-height:108px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.045);
  overflow:hidden;
  transition:.22s ease;
}

.site-card:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 30px rgba(19,39,35,.12);
  border-color:#d5cec0;
}

.site-link{
  min-height:108px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px 20px;
  color:var(--text);
  text-decoration:none;
  font-size:18px;
  font-weight:750;
  text-align:center;
  line-height:1.45;
}

.site-card:not(.editing) .site-link:hover{
  background:linear-gradient(135deg,#fff,#faf8f3);
}

/* EDIT MODE */

.edit-mode .sites{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.edit-mode .site-card{
  min-height:76px;
  display:flex;
  align-items:center;
  padding:9px 12px;
  border-radius:14px;
  cursor:default;
}

.edit-mode .site-card:hover{
  transform:none;
  box-shadow:0 4px 12px rgba(0,0,0,.045);
}

.edit-mode .site-link{
  min-height:auto;
  flex:1;
  justify-content:flex-start;
  text-align:right;
  padding:10px 8px;
  font-size:16px;
}

.drag-handle{
  width:38px;
  height:38px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  color:#9a9b96;
  font-size:23px;
  cursor:grab;
  user-select:none;
}

.drag-handle:active{
  cursor:grabbing;
}

.site-card.dragging{
  opacity:.45;
}

.edit-actions{
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
}

.icon-action{
  width:39px;
  height:39px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.18s ease;
  font-size:17px;
}

.icon-action.edit{
  color:var(--green);
}

.icon-action.edit:hover{
  background:#eef4f1;
  border-color:#cbd8d3;
  transform:translateY(-1px);
}

.icon-action.delete{
  color:var(--danger);
  border-color:#f0d6d6;
  background:#fff8f8;
  font-size:21px;
  font-weight:500;
}

.icon-action.delete:hover{
  background:#fff0f0;
  border-color:#e8bcbc;
  transform:translateY(-1px);
}

/* EMPTY */

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:72px 20px;
  background:#fff;
  border:1px dashed #d7d1c6;
  border-radius:20px;
  color:var(--muted);
}

.empty-icon{
  width:58px;
  height:58px;
  margin:0 auto 16px;
  border-radius:17px;
  background:#f4f1e9;
  color:var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
}

.empty h2{
  margin:0 0 8px;
  color:var(--text);
  font-size:20px;
}

.empty p{
  margin:0;
  line-height:1.6;
}

/* MODALS */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(10,25,22,.48);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
  backdrop-filter:blur(6px);
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(500px,100%);
  background:#fff;
  border-radius:21px;
  padding:25px;
  box-shadow:0 25px 80px rgba(0,0,0,.25);
  animation:modalIn .18s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(8px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
}

.modal h2{
  margin:0;
  font-size:21px;
}

.close{
  border:0;
  background:#f3f1ec;
  color:#555;
  width:36px;
  height:36px;
  border-radius:50%;
  cursor:pointer;
  font-size:22px;
  line-height:1;
}

.close:hover{
  background:#eae7df;
}

.modal p{
  color:var(--muted);
  font-size:14px;
  line-height:1.65;
  margin:0 0 18px;
}

.form-group{
  margin:16px 0;
}

.form-group label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin-bottom:7px;
}

input[type=text],
input[type=url]{
  width:100%;
  border:1px solid #d8d4ca;
  border-radius:11px;
  padding:12px 13px;
  outline:none;
  background:#fbfaf7;
  color:var(--text);
  direction:auto;
}

input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(189,161,106,.15);
}

.form-actions{
  display:flex;
  gap:9px;
  justify-content:flex-start;
  margin-top:22px;
}

.form-actions button{
  min-width:100px;
}

/* CONFIRM */

.confirm-danger{
  border:0;
  background:var(--danger);
  color:#fff;
  border-radius:11px;
  padding:11px 17px;
  cursor:pointer;
  font-weight:700;
}

.confirm-danger:hover{
  background:#b63f3f;
}

/* TOAST */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:var(--green);
  color:#fff;
  padding:12px 17px;
  border-radius:12px;
  box-shadow:var(--shadow);
  display:none;
  z-index:2000;
  max-width:360px;
  line-height:1.5;
}

.toast.show{
  display:block;
}

.toast.error{
  background:#8d3030;
}

/* MOBILE */

@media(max-width:700px){

  header{
    padding:31px 16px 27px;
  }

  header h1{
    font-size:25px;
  }

  main{
    margin:25px auto;
    padding:0 15px 50px;
  }

  .toolbar{
    flex-direction:column;
    align-items:stretch;
  }

  .status{
    text-align:center;
  }

  .toolbar-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .toolbar-actions button{
    width:100%;
  }

  .sites{
    grid-template-columns:1fr;
    gap:12px;
  }

  .site-card,
  .site-link{
    min-height:82px;
  }

  .edit-mode .site-card{
    padding:8px;
  }

  .edit-mode .site-link{
    font-size:15px;
    padding:8px 5px;
  }

  .drag-handle{
    width:32px;
  }

  .icon-action{
    width:36px;
    height:36px;
  }

  .modal{
    padding:21px;
  }

  .toast{
    right:15px;
    left:15px;
    bottom:15px;
    max-width:none;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">📄</div>
    <h1>Sites المواقع</h1>
    <p>بوابة المواقع</p>
  </div>
</header>

<main>

  <div class="toolbar">

    <div class="status" id="status">
      جاري تحميل المواقع…
    </div>

    <div class="toolbar-actions">

      <button class="primary" id="addBtn">
        ＋ إضافة موقع
      </button>

      <button class="edit-toggle" id="editBtn">
        ✏️ تعديل المواقع
      </button>

      <button class="finish-edit" id="finishBtn" style="display:none">
        ✓ إنهاء التعديل
      </button>

    </div>

  </div>

  <div id="sites" class="sites"></div>

</main>


<!-- ADD / EDIT SITE MODAL -->

<div class="modal-backdrop" id="siteModal">

  <div class="modal">

    <div class="modal-header">
      <h2 id="modalTitle">إضافة موقع</h2>
      <button class="close" id="closeModal">×</button>
    </div>

    <p id="modalSubtitle">
      أدخل اسم الموقع والرابط.
    </p>

    <div class="form-group">
      <label for="siteName">اسم الموقع</label>
      <input
        id="siteName"
        type="text"
        maxlength="80"
        placeholder="مثال: دليل العمرة"
      >
    </div>

    <div class="form-group">
      <label for="siteUrl">الرابط</label>
      <input
        id="siteUrl"
        type="url"
        maxlength="500"
        placeholder="https://example.com"
      >
    </div>

    <div class="form-actions">
      <button class="primary" id="saveSite">
        حفظ
      </button>

      <button class="secondary" id="cancelModal">
        إلغاء
      </button>
    </div>

  </div>

</div>


<!-- DELETE CONFIRMATION -->

<div class="modal-backdrop" id="deleteModal">

  <div class="modal">

    <div class="modal-header">
      <h2>حذف الموقع؟</h2>
      <button class="close" id="closeDelete">×</button>
    </div>

    <p id="deleteText">
      سيتم حذف الموقع من القائمة.
    </p>

    <div class="form-actions">

      <button class="confirm-danger" id="confirmDelete">
        حذف
      </button>

      <button class="secondary" id="cancelDelete">
        إلغاء
      </button>

    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* -----------------------------------------
   ELEMENTS
----------------------------------------- */

const $ = id => document.getElementById(id);

const sitesEl = $("sites");
const statusEl = $("status");

const addBtn = $("addBtn");
const editBtn = $("editBtn");
const finishBtn = $("finishBtn");

const siteModal = $("siteModal");
const deleteModal = $("deleteModal");

const siteName = $("siteName");
const siteUrl = $("siteUrl");

let db = null;

let sitesData = [];

let editMode = false;

let editingIndex = null;

let deletingIndex = null;


/* -----------------------------------------
   TOAST
----------------------------------------- */

function toast(message, error=false){

  const t = $("toast");

  t.textContent = message;

  t.className = "toast show";

  if(error){
    t.classList.add("error");
  }

  clearTimeout(window.__toast);

  window.__toast = setTimeout(()=>{
    t.className = "toast";
  },3000);
}


/* -----------------------------------------
   MODALS
----------------------------------------- */

function showModal(id){
  $(id).classList.add("show");
}

function hideModal(id){
  $(id).classList.remove("show");
}


/* -----------------------------------------
   LOAD FIREBASE CONFIG
----------------------------------------- */

async function boot(){

  try{

    const response = await fetch("/api/config", {
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error("تعذر تحميل إعدادات Firebase.");
    }

    const config = await response.json();

    if(
      !config.apiKey ||
      !config.projectId ||
      !config.databaseURL
    ){
      throw new Error("إعدادات Firebase غير مكتملة.");
    }

    const app = initializeApp(config);

    db = getDatabase(app, config.databaseURL);

    listenToSites();

  }catch(error){

    console.error(error);

    statusEl.textContent = "تعذر الاتصال بقاعدة البيانات.";

    toast(
      error.message || "حدث خطأ أثناء التشغيل.",
      true
    );

  }

}


/* -----------------------------------------
   FIREBASE LISTENER
----------------------------------------- */

function listenToSites(){

  const sitesRef = ref(db,"sites");

  onValue(
    sitesRef,

    snapshot => {

      const value = snapshot.val();

      sitesData =
        Array.isArray(value)
          ? value.filter(Boolean)
          : [];

      render();

    },

    error => {

      console.error(error);

      statusEl.textContent =
        "تعذر تحميل المواقع.";

      toast(
        "تحقق من Firebase وقواعد Realtime Database.",
        true
      );

    }
  );

}


/* -----------------------------------------
   RENDER
----------------------------------------- */

function render(){

  if(editMode){

    renderEditMode();

  }else{

    renderNormalMode();

  }

}


/* -----------------------------------------
   NORMAL MODE
----------------------------------------- */

function renderNormalMode(){

  document.body.classList.remove("edit-mode");

  addBtn.style.display = "block";

  editBtn.style.display = "block";

  finishBtn.style.display = "none";

  sitesEl.className = "sites";

  statusEl.textContent =
    sitesData.length
      ? `${sitesData.length} موقع`
      : "لا توجد مواقع حالياً";

  sitesEl.innerHTML = "";

  if(!sitesData.length){

    sitesEl.innerHTML = `
      <div class="empty">

        <div class="empty-icon">＋</div>

        <h2>لا توجد مواقع بعد</h2>

        <p>
          اضغط «إضافة موقع» لإضافة أول موقع إلى البوابة.
        </p>

      </div>
    `;

    return;
  }


  sitesData.forEach(site => {

    const card = document.createElement("div");

    card.className = "site-card";


    const link = document.createElement("a");

    link.className = "site-link";

    link.href = site.url;

    link.target = "_blank";

    link.rel = "noopener noreferrer";

    link.textContent = site.name;


    card.appendChild(link);

    sitesEl.appendChild(card);

  });

}


/* -----------------------------------------
   EDIT MODE
----------------------------------------- */

function renderEditMode(){

  document.body.classList.add("edit-mode");

  addBtn.style.display = "block";

  editBtn.style.display = "none";

  finishBtn.style.display = "block";

  sitesEl.className = "sites";

  statusEl.textContent =
    sitesData.length
      ? `${sitesData.length} موقع — يمكنك التعديل أو السحب لإعادة الترتيب`
      : "وضع التعديل — القائمة فارغة";

  sitesEl.innerHTML = "";


  if(!sitesData.length){

    sitesEl.innerHTML = `
      <div class="empty">

        <div class="empty-icon">＋</div>

        <h2>القائمة فارغة</h2>

        <p>
          يمكنك إضافة موقع جديد باستخدام زر «إضافة موقع».
        </p>

      </div>
    `;

    return;

  }


  sitesData.forEach((site,index) => {

    const card = document.createElement("div");

    card.className = "site-card editing";

    card.draggable = true;

    card.dataset.index = index;


    /* DRAG */

    const drag = document.createElement("div");

    drag.className = "drag-handle";

    drag.textContent = "☷";

    drag.title = "اسحب لإعادة الترتيب";


    /* LINK */

    const link = document.createElement("a");

    link.className = "site-link";

    link.href = site.url;

    link.target = "_blank";

    link.rel = "noopener noreferrer";

    link.textContent = site.name;


    /* ACTIONS */

    const actions = document.createElement("div");

    actions.className = "edit-actions";


    const editButton = document.createElement("button");

    editButton.className = "icon-action edit";

    editButton.title = "تعديل";

    editButton.setAttribute("aria-label","تعديل");

    editButton.textContent = "✏️";


    const deleteButton = document.createElement("button");

    deleteButton.className = "icon-action delete";

    deleteButton.title = "حذف";

    deleteButton.setAttribute("aria-label","حذف");

    deleteButton.textContent = "×";


    editButton.onclick = event => {

      event.preventDefault();

      event.stopPropagation();

      openSiteModal(index);

    };


    deleteButton.onclick = event => {

      event.preventDefault();

      event.stopPropagation();

      openDeleteModal(index);

    };


    actions.appendChild(editButton);

    actions.appendChild(deleteButton);


    card.appendChild(drag);

    card.appendChild(link);

    card.appendChild(actions);


    /* DRAG EVENTS */

    card.addEventListener("dragstart",() => {

      card.classList.add("dragging");

    });


    card.addEventListener("dragend",async () => {

      card.classList.remove("dragging");

      await saveOrderFromDOM();

    });


    card.addEventListener("dragover",event => {

      event.preventDefault();

      const dragging =
        sitesEl.querySelector(".dragging");

      if(!dragging || dragging === card){
        return;
      }

      const rect =
        card.getBoundingClientRect();

      const after =
        event.clientY >
        rect.top + rect.height / 2;

      sitesEl.insertBefore(
        dragging,
        after ? card.nextSibling : card
      );

    });


    sitesEl.appendChild(card);

  });

}


/* -----------------------------------------
   ENTER EDIT MODE
----------------------------------------- */

function enterEditMode(){

  editMode = true;

  render();

}


/* -----------------------------------------
   EXIT EDIT MODE
----------------------------------------- */

async function exitEditMode(){

  await saveOrderFromDOM();

  editMode = false;

  render();

  toast("تم إنهاء التعديل.");

}


/* -----------------------------------------
   SAVE ORDER
----------------------------------------- */

async function saveOrderFromDOM(){

  if(!editMode){
    return true;
  }

  const cards =
    [...sitesEl.querySelectorAll(".site-card")];

  if(!cards.length){
    return true;
  }


  const reordered =
    cards.map(card =>
      sitesData[Number(card.dataset.index)]
    );


  if(
    JSON.stringify(reordered) ===
    JSON.stringify(sitesData)
  ){

    return true;

  }


  sitesData = reordered;


  return await saveSites(false);

}


/* -----------------------------------------
   SAVE FIREBASE
----------------------------------------- */

async function saveSites(showMessage=true){

  if(!db){

    toast(
      "Firebase غير متصل.",
      true
    );

    return false;

  }


  try{

    await set(
      ref(db,"sites"),
      sitesData.length
        ? sitesData
        : null
    );


    if(showMessage){
      toast("تم حفظ التغييرات.");
    }


    return true;

  }catch(error){

    console.error(error);

    toast(
      "تعذر الحفظ: " +
      (error.message || "تحقق من Firebase."),
      true
    );

    return false;

  }

}


/* -----------------------------------------
   ADD / EDIT MODAL
----------------------------------------- */

function openSiteModal(index=null){

  editingIndex = index;


  if(index === null){

    $("modalTitle").textContent =
      "إضافة موقع";

    $("modalSubtitle").textContent =
      "أدخل اسم الموقع والرابط.";

    siteName.value = "";

    siteUrl.value = "";

  }else{

    $("modalTitle").textContent =
      "تعديل الموقع";

    $("modalSubtitle").textContent =
      "عدّل اسم الموقع أو الرابط ثم اضغط حفظ.";

    siteName.value =
      sitesData[index].name;

    siteUrl.value =
      sitesData[index].url;

  }


  showModal("siteModal");

  setTimeout(()=>{
    siteName.focus();
  },100);

}


/* -----------------------------------------
   SAVE SITE
----------------------------------------- */

async function saveSite(){

  const name =
    siteName.value.trim();

  let url =
    siteUrl.value.trim();


  if(!name){

    toast(
      "أدخل اسم الموقع.",
      true
    );

    siteName.focus();

    return;

  }


  if(!url){

    toast(
      "أدخل الرابط.",
      true
    );

    siteUrl.focus();

    return;

  }


  if(!/^https?:\/\//i.test(url)){

    url = "https://" + url;

  }


  try{

    new URL(url);

  }catch{

    toast(
      "الرابط غير صحيح.",
      true
    );

    siteUrl.focus();

    return;

  }


  const newSite = {
    name,
    url
  };


  if(editingIndex === null){

    sitesData.push(newSite);

  }else{

    sitesData[editingIndex] =
      newSite;

  }


  const saved =
    await saveSites(false);


  if(saved){

    hideModal("siteModal");

    toast(
      editingIndex === null
        ? "تمت إضافة الموقع."
        : "تم تعديل الموقع."
    );

    editingIndex = null;

    render();

  }

}


/* -----------------------------------------
   DELETE
----------------------------------------- */

function openDeleteModal(index){

  deletingIndex = index;

  $("deleteText").textContent =
    `سيتم حذف «${sitesData[index].name}» نهائياً من القائمة.`;

  showModal("deleteModal");

}


async function deleteSite(){

  if(deletingIndex === null){
    return;
  }


  const index =
    deletingIndex;


  sitesData.splice(index,1);

  deletingIndex = null;


  const saved =
    await saveSites(false);


  hideModal("deleteModal");


  if(saved){

    toast("تم حذف الموقع.");

    render();

  }

}


/* -----------------------------------------
   BUTTON EVENTS
----------------------------------------- */

addBtn.onclick = () => {

  openSiteModal(null);

};


editBtn.onclick = () => {

  enterEditMode();

};


finishBtn.onclick = () => {

  exitEditMode();

};


$("saveSite").onclick = saveSite;


$("cancelModal").onclick = () => {

  hideModal("siteModal");

};


$("closeModal").onclick = () => {

  hideModal("siteModal");

};


$("confirmDelete").onclick = deleteSite;


$("cancelDelete").onclick = () => {

  hideModal("deleteModal");

};


$("closeDelete").onclick = () => {

  hideModal("deleteModal");

};


/* -----------------------------------------
   OUTSIDE CLICK
----------------------------------------- */

siteModal.addEventListener(
  "click",
  event => {

    if(event.target === event.currentTarget){

      hideModal("siteModal");

    }

  }
);


deleteModal.addEventListener(
  "click",
  event => {

    if(event.target === event.currentTarget){

      hideModal("deleteModal");

    }

  }
);


/* -----------------------------------------
   KEYBOARD
----------------------------------------- */

siteName.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      siteUrl.focus();

    }

  }
);


siteUrl.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      saveSite();

    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      hideModal("siteModal");

      hideModal("deleteModal");

    }

  }
);


/* -----------------------------------------
   START
----------------------------------------- */

boot();

</script>

</body>
</html>
