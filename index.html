<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pages الصفحات</title>

<link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📄%3C/text%3E%3C/svg%3E"
>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, Tahoma, sans-serif;

    background: #f3f1ec;
    color: #24332f;
}

/* =========================================================
   HEADER
========================================================= */

header {
    background: #132723;
    color: white;

    padding: 24px 28px;

    box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.08);
}

.header-inner {
    max-width: 1100px;
    margin: 0 auto;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
}

/* =========================================================
   BRAND
========================================================= */

.brand {
    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;


}

.brand h1 {
    margin: 0;

    font-size: 23px;
    line-height: 1.25;

    font-weight: 600;

    letter-spacing: 0;
}

.brand p {
    margin: 4px 0 0;

    font-size: 13px;
    line-height: 1.4;

    color: rgba(255, 255, 255, 0.68);

    font-weight: 400;

    text-align: center;
}

/* =========================================================
   HEADER ACTIONS
========================================================= */

.header-actions {
    position: absolute;
    left: 0;
    display: flex;
    align-items: center;

    gap: 9px;

    flex-shrink: 0;
}

.header-btn {
    border-radius: 9px;

    padding: 9px 13px;

    font-family: inherit;
    font-size: 13px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

/* =========================================================
   ADD BUTTON — CONTRASTING
========================================================= */

.header-btn.add {
    background: #bda16a;

    border: 1px solid #bda16a;

    color: #ffffff;

    box-shadow:
        0 3px 10px rgba(189, 161, 106, 0.18);
}

.header-btn.add:hover {
    background: #c8ad78;

    border-color: #c8ad78;

    transform: translateY(-1px);

    box-shadow:
        0 6px 16px rgba(189, 161, 106, 0.25);
}

/* =========================================================
   EDIT BUTTON
========================================================= */

.header-btn.edit,
.header-btn.finish {
    background: rgba(255, 255, 255, 0.07);

    border: 1px solid rgba(255, 255, 255, 0.18);

    color: white;
}

.header-btn.edit:hover,
.header-btn.finish:hover {
    background: #bda16a;

    border-color: #bda16a;

    transform: translateY(-1px);
}

.header-btn.finish {
    display: none;
}

.editing .header-btn.edit {
    display: none;
}

.editing .header-btn.finish {
    display: inline-flex;
}

.header-btn:active {
    transform: translateY(0) scale(0.98);
}

/* =========================================================
   CONTENT
========================================================= */

main {
    max-width: 1100px;

    margin: 42px auto;

    padding: 0 20px;
}

/* =========================================================
   SITE GRID
========================================================= */

.sites {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));

    gap: 18px;
}

/* =========================================================
   SITE CARD
========================================================= */

.site {
    position: relative;

    min-height: 85px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: #ffffff;

    border: 1px solid #e2dfd8;

    border-radius: 14px;

    color: #24332f;

    text-decoration: none;

    font-size: 18px;
    font-weight: 600;

    box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.04);

    transition:
        transform 0.2s ease,
        background-color 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.site:hover {
    background: #bda16a;

    color: #ffffff;

    border-color: #bda16a;

    transform: translateY(-4px);

    box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.12);
}

.site:active {
    transform: translateY(-1px) scale(0.98);

    box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.08);
}

.site:focus-visible {
    outline: 3px solid #bda16a;
    outline-offset: 3px;
}

/* =========================================================
   EDIT MODE
========================================================= */

.edit-card {
    position: relative;

    min-height: 85px;

    display: flex;
    align-items: center;

    padding: 9px;

    background: #ffffff;

    border: 1px solid #e2dfd8;

    border-radius: 14px;

    box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.04);

    cursor: grab;

    transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.edit-card:hover {
    border-color: #bda16a;

    box-shadow:
        0 7px 18px rgba(0, 0, 0, 0.08);
}

.edit-card.dragging {
    opacity: 0.55;
    transform: scale(0.98);
}

.edit-card-content {
    flex: 1;

    min-width: 0;

    padding: 8px 9px;

    text-align: right;
}

.edit-card-name {
    font-size: 16px;
    font-weight: 600;

    color: #24332f;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.edit-card-url {
    margin-top: 4px;

    font-size: 11px;

    color: #8a918e;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    direction: ltr;
    text-align: right;
}

.edit-actions {
    display: flex;
    align-items: center;

    gap: 5px;
}

.edit-icon,
.delete-icon {
    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 8px;

    border: 1px solid #e5e1da;

    background: #faf9f6;

    cursor: pointer;

    font-family: inherit;
    font-size: 15px;

    transition:
        background-color 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        transform 0.15s ease;
}

.edit-icon:hover {
    background: #bda16a;
    border-color: #bda16a;
    color: white;
}

.delete-icon {
    color: #c64747;
    font-size: 18px;
    font-weight: 600;
}

.delete-icon:hover {
    background: #c64747;
    border-color: #c64747;
    color: white;
}

.edit-icon:active,
.delete-icon:active {
    transform: scale(0.94);
}

.drag-handle {
    color: #aaa39a;

    font-size: 18px;

    padding: 5px 2px;

    cursor: grab;

    user-select: none;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty,
.loading {
    grid-column: 1 / -1;

    text-align: center;

    padding: 55px 20px;

    color: #858b87;

    font-size: 15px;
}

.empty strong {
    display: block;

    margin-bottom: 7px;

    color: #24332f;

    font-size: 18px;
}

/* =========================================================
   MODALS
========================================================= */

.modal-overlay {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(19, 39, 35, 0.45);

    backdrop-filter: blur(5px);
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 430px;

    background: #ffffff;

    border-radius: 16px;

    padding: 25px;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.20);

    animation: modalIn 0.18s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin-bottom: 22px;
}

.modal-title {
    margin: 0;

    color: #24332f;

    font-size: 20px;
    font-weight: 600;
}

.modal-close {
    width: 32px;
    height: 32px;

    border: 0;

    border-radius: 8px;

    background: #f3f1ec;

    color: #68716d;

    cursor: pointer;

    font-size: 18px;

    transition: 0.2s ease;
}

.modal-close:hover {
    background: #bda16a;
    color: white;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;

    margin-bottom: 7px;

    color: #394843;

    font-size: 13px;
    font-weight: 600;
}

.field input {
    width: 100%;

    height: 45px;

    padding: 0 13px;

    border: 1px solid #ddd9d1;

    border-radius: 9px;

    background: #faf9f6;

    color: #24332f;

    font-family: inherit;
    font-size: 14px;

    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.field input:focus {
    border-color: #bda16a;

    box-shadow:
        0 0 0 3px rgba(189, 161, 106, 0.15);

    background: white;
}

.modal-buttons {
    display: flex;

    gap: 9px;

    margin-top: 22px;
}

.modal-btn {
    flex: 1;

    height: 43px;

    border-radius: 9px;

    border: 1px solid #ddd9d1;

    font-family: inherit;

    font-size: 13px;
    font-weight: 600;

    cursor: pointer;

    transition: 0.2s ease;
}

.modal-btn.cancel {
    background: #f5f3ef;
    color: #59625e;
}

.modal-btn.cancel:hover {
    background: #e9e5dd;
}

.modal-btn.save {
    background: #132723;
    color: white;
    border-color: #132723;
}

.modal-btn.save:hover {
    background: #bda16a;
    border-color: #bda16a;
}

.delete-modal {
    max-width: 390px;
    text-align: center;
}

.delete-title {
    margin: 0 0 10px;

    color: #24332f;

    font-size: 20px;
}

.delete-message {
    margin: 0;

    color: #66706b;

    font-size: 14px;

    line-height: 1.7;
}

.delete-confirm {
    background: #c64747;
    color: white;
    border-color: #c64747;
}

.delete-confirm:hover {
    background: #ad3838;
    border-color: #ad3838;
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    z-index: 2000;

    transform: translate(-50%, 20px);

    padding: 11px 17px;

    border-radius: 9px;

    background: #132723;
    color: white;

    font-size: 13px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.18);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

.toast.error {
    background: #c64747;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    header {
        padding: 20px 15px;
    }

    .header-inner {
        flex-direction: column;

        gap: 14px;

        text-align: center;
    }

    .brand {
        align-items: center;
    }

    .brand h1 {
        font-size: 21px;
    }

    .brand p {
        font-size: 12px;
    }

    .header-actions {
        width: 100%;

        justify-content: center;
    }

    .header-btn {
        padding: 8px 12px;

        font-size: 12px;
    }

    main {
        margin: 30px auto;

        padding: 0 15px;
    }

    .sites {
        grid-template-columns: 1fr;

        gap: 12px;
    }

    .site {
        min-height: 70px;

        font-size: 17px;
    }

    .edit-card {
        min-height: 70px;
    }
}

@media (max-width: 390px) {

    .header-actions {
        gap: 6px;
    }

    .header-btn {
        padding: 8px 9px;

        font-size: 11px;
    }

    .brand h1 {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<header id="header">

    <div class="header-inner">

        <div class="brand">
            <h1>المواقع Sites</h1>
            <p>بوابة المواقع</p>
        </div>

        <div class="header-actions">

            <button
                class="header-btn add"
                id="addBtn"
                type="button"
            >
                ＋ إضافة موقع
            </button>

            <button
                class="header-btn edit"
                id="editBtn"
                type="button"
            >
                ✏️ تعديل المواقع
            </button>

            <button
                class="header-btn finish"
                id="finishBtn"
                type="button"
            >
                ✓ إنهاء التعديل
            </button>

        </div>

    </div>

</header>


<main>

    <div
        class="sites"
        id="sites"
    >
        <div class="loading">
            جاري تحميل المواقع…
        </div>
    </div>

</main>


<!-- ADD / EDIT MODAL -->

<div
    class="modal-overlay"
    id="siteModal"
>

    <div class="modal">

        <div class="modal-header">

            <h2
                class="modal-title"
                id="modalTitle"
            >
                إضافة موقع
            </h2>

            <button
                class="modal-close"
                id="modalClose"
                type="button"
            >
                ×
            </button>

        </div>

        <form id="siteForm">

            <div class="field">

                <label for="siteName">
                    اسم الموقع
                </label>

                <input
                    id="siteName"
                    type="text"
                    placeholder="مثال: الحرمين"
                    autocomplete="off"
                    required
                >

            </div>

            <div class="field">

                <label for="siteUrl">
                    رابط الموقع
                </label>

                <input
                    id="siteUrl"
                    type="url"
                    placeholder="https://example.com"
                    autocomplete="url"
                    required
                >

            </div>

            <div class="modal-buttons">

                <button
                    class="modal-btn cancel"
                    id="cancelBtn"
                    type="button"
                >
                    إلغاء
                </button>

                <button
                    class="modal-btn save"
                    type="submit"
                >
                    حفظ
                </button>

            </div>

        </form>

    </div>

</div>


<!-- DELETE MODAL -->

<div
    class="modal-overlay"
    id="deleteModal"
>

    <div class="modal delete-modal">

        <h2 class="delete-title">
            حذف الموقع؟
        </h2>

        <p
            class="delete-message"
            id="deleteMessage"
        >
            هل أنت متأكد من حذف هذا الموقع؟
        </p>

        <div class="modal-buttons">

            <button
                class="modal-btn cancel"
                id="deleteCancel"
                type="button"
            >
                إلغاء
            </button>

            <button
                class="modal-btn delete-confirm"
                id="deleteConfirm"
                type="button"
            >
                حذف
            </button>

        </div>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

let sites = [];
let editingIndex = null;
let deletingIndex = null;
let draggedIndex = null;

const header =
    document.getElementById("header");

const sitesContainer =
    document.getElementById("sites");

const addBtn =
    document.getElementById("addBtn");

const editBtn =
    document.getElementById("editBtn");

const finishBtn =
    document.getElementById("finishBtn");

const siteModal =
    document.getElementById("siteModal");

const deleteModal =
    document.getElementById("deleteModal");

const siteForm =
    document.getElementById("siteForm");

const siteName =
    document.getElementById("siteName");

const siteUrl =
    document.getElementById("siteUrl");

const modalTitle =
    document.getElementById("modalTitle");

const modalClose =
    document.getElementById("modalClose");

const cancelBtn =
    document.getElementById("cancelBtn");

const deleteCancel =
    document.getElementById("deleteCancel");

const deleteConfirm =
    document.getElementById("deleteConfirm");

const deleteMessage =
    document.getElementById("deleteMessage");

const toast =
    document.getElementById("toast");


/* =========================================================
   LOAD
========================================================= */

async function loadSites() {

    try {

        const response =
            await fetch("/api/sites", {
                method: "GET",
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error(
                "تعذر تحميل المواقع"
            );
        }

        const data =
            await response.json();

        sites =
            Array.isArray(data.sites)
                ? data.sites
                : [];

        renderNormal();

    } catch (error) {

        console.error(error);

        sitesContainer.innerHTML = `
            <div class="empty">
                <strong>تعذر تحميل المواقع</strong>
                تحقق من اتصال الموقع بالخادم.
            </div>
        `;

        showToast(
            "تعذر تحميل المواقع",
            true
        );
    }
}


/* =========================================================
   SAVE
========================================================= */

async function saveSites() {

    try {

        const response =
            await fetch("/api/sites", {

                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    sites: sites
                })

            });

        if (!response.ok) {

            let message =
                "تعذر حفظ التغييرات";

            try {

                const data =
                    await response.json();

                if (data.error) {
                    message = data.error;
                }

            } catch (_) {}

            throw new Error(message);
        }

        return true;

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "تعذر حفظ التغييرات",
            true
        );

        return false;
    }
}


/* =========================================================
   NORMAL VIEW
========================================================= */

function renderNormal() {

    sitesContainer.innerHTML = "";

    if (!sites.length) {

        sitesContainer.innerHTML = `
            <div class="empty">
                <strong>لا توجد مواقع بعد</strong>
                اضغط «＋ إضافة موقع» لإضافة أول موقع.
            </div>
        `;

        return;
    }

    sites.forEach(site => {

        const link =
            document.createElement("a");

        link.className = "site";

        link.href = site.url;

        link.target = "_blank";

        link.rel =
            "noopener noreferrer";

        link.textContent =
            site.name;

        sitesContainer.appendChild(link);
    });
}


/* =========================================================
   EDIT VIEW
========================================================= */

function renderEdit() {

    sitesContainer.innerHTML = "";

    if (!sites.length) {

        sitesContainer.innerHTML = `
            <div class="empty">
                <strong>لا توجد مواقع</strong>
                أضف موقعاً جديداً من زر «＋ إضافة موقع».
            </div>
        `;

        return;
    }

    sites.forEach((site, index) => {

        const card =
            document.createElement("div");

        card.className =
            "edit-card";

        card.draggable = true;

        card.dataset.index = index;

        card.addEventListener(
            "dragstart",
            () => {

                draggedIndex = index;

                card.classList.add(
                    "dragging"
                );
            }
        );

        card.addEventListener(
            "dragend",
            () => {

                card.classList.remove(
                    "dragging"
                );

                draggedIndex = null;
            }
        );

        card.addEventListener(
            "dragover",
            event => {

                event.preventDefault();

                if (
                    draggedIndex === null ||
                    draggedIndex === index
                ) {
                    return;
                }

                const draggedSite =
                    sites[draggedIndex];

                sites.splice(
                    draggedIndex,
                    1
                );

                sites.splice(
                    index,
                    0,
                    draggedSite
                );

                draggedIndex = index;

                renderEdit();
            }
        );


        const handle =
            document.createElement("div");

        handle.className =
            "drag-handle";

        handle.textContent =
            "⋮⋮";


        const content =
            document.createElement("div");

        content.className =
            "edit-card-content";


        const name =
            document.createElement("div");

        name.className =
            "edit-card-name";

        name.textContent =
            site.name;


        const url =
            document.createElement("div");

        url.className =
            "edit-card-url";

        url.textContent =
            site.url;


        content.appendChild(name);

        content.appendChild(url);


        const actions =
            document.createElement("div");

        actions.className =
            "edit-actions";


        const edit =
            document.createElement("button");

        edit.type = "button";

        edit.className =
            "edit-icon";

        edit.textContent =
            "✎";

        edit.title =
            "تعديل الموقع";


        edit.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                openEditModal(index);
            }
        );


        const remove =
            document.createElement("button");

        remove.type = "button";

        remove.className =
            "delete-icon";

        remove.textContent =
            "×";

        remove.title =
            "حذف الموقع";


        remove.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                openDeleteModal(index);
            }
        );


        actions.appendChild(edit);

        actions.appendChild(remove);


        card.appendChild(handle);

        card.appendChild(content);

        card.appendChild(actions);


        sitesContainer.appendChild(card);
    });
}


/* =========================================================
   EDIT MODE
========================================================= */

function enterEditMode() {

    header.classList.add(
        "editing"
    );

    renderEdit();
}


async function exitEditMode() {

    const saved =
        await saveSites();

    if (!saved) {
        return;
    }

    header.classList.remove(
        "editing"
    );

    renderNormal();

    showToast(
        "تم حفظ التغييرات"
    );
}


/* =========================================================
   ADD
========================================================= */

function openAddModal() {

    editingIndex = null;

    modalTitle.textContent =
        "إضافة موقع";

    siteName.value = "";

    siteUrl.value = "";

    siteModal.classList.add(
        "show"
    );

    setTimeout(
        () => siteName.focus(),
        50
    );
}


/* =========================================================
   EDIT
========================================================= */

function openEditModal(index) {

    editingIndex = index;

    const site =
        sites[index];

    modalTitle.textContent =
        "تعديل الموقع";

    siteName.value =
        site.name || "";

    siteUrl.value =
        site.url || "";

    siteModal.classList.add(
        "show"
    );

    setTimeout(
        () => siteName.focus(),
        50
    );
}


/* =========================================================
   SUBMIT
========================================================= */

async function submitSite(event) {

    event.preventDefault();

    const name =
        siteName.value.trim();

    const url =
        siteUrl.value.trim();


    if (!name || !url) {

        showToast(
            "يرجى إدخال اسم الموقع والرابط",
            true
        );

        return;
    }


    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ) {

        showToast(
            "يجب أن يبدأ الرابط بـ https:// أو http://",
            true
        );

        return;
    }


    const wasEditing =
        editingIndex !== null;


    if (!wasEditing) {

        sites.push({
            name,
            url
        });

    } else {

        sites[editingIndex] = {
            name,
            url
        };
    }


    closeSiteModal();


    if (
        header.classList.contains(
            "editing"
        )
    ) {

        renderEdit();

    } else {

        renderNormal();
    }


    const saved =
        await saveSites();

    if (saved) {

        showToast(
            wasEditing
                ? "تم تحديث الموقع"
                : "تمت إضافة الموقع"
        );
    }
}


/* =========================================================
   DELETE
========================================================= */

function openDeleteModal(index) {

    deletingIndex = index;

    const site =
        sites[index];

    deleteMessage.textContent =
        `هل أنت متأكد من حذف «${site.name}»؟`;

    deleteModal.classList.add(
        "show"
    );
}


async function confirmDelete() {

    if (deletingIndex === null) {
        return;
    }

    sites.splice(
        deletingIndex,
        1
    );

    deletingIndex = null;

    deleteModal.classList.remove(
        "show"
    );

    renderEdit();

    const saved =
        await saveSites();

    if (saved) {

        showToast(
            "تم حذف الموقع"
        );
    }
}


/* =========================================================
   MODALS
========================================================= */

function closeSiteModal() {

    siteModal.classList.remove(
        "show"
    );

    siteForm.reset();

    editingIndex = null;
}


function closeDeleteModal() {

    deleteModal.classList.remove(
        "show"
    );

    deletingIndex = null;
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(
    message,
    error = false
) {

    clearTimeout(toastTimer);

    toast.textContent =
        message;

    toast.classList.toggle(
        "error",
        error
    );

    toast.classList.add(
        "show"
    );

    toastTimer =
        setTimeout(
            () => {
                toast.classList.remove(
                    "show"
                );
            },
            2600
        );
}


/* =========================================================
   EVENTS
========================================================= */

addBtn.addEventListener(
    "click",
    openAddModal
);

editBtn.addEventListener(
    "click",
    enterEditMode
);

finishBtn.addEventListener(
    "click",
    exitEditMode
);

siteForm.addEventListener(
    "submit",
    submitSite
);

modalClose.addEventListener(
    "click",
    closeSiteModal
);

cancelBtn.addEventListener(
    "click",
    closeSiteModal
);

deleteCancel.addEventListener(
    "click",
    closeDeleteModal
);

deleteConfirm.addEventListener(
    "click",
    confirmDelete
);

siteModal.addEventListener(
    "click",
    event => {

        if (
            event.target === siteModal
        ) {
            closeSiteModal();
        }
    }
);

deleteModal.addEventListener(
    "click",
    event => {

        if (
            event.target === deleteModal
        ) {
            closeDeleteModal();
        }
    }
);

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeSiteModal();

            closeDeleteModal();
        }
    }
);


/* =========================================================
   START
========================================================= */

loadSites();

</script>

</body>
</html>
